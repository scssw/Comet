name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0-alpha.1). If left blank, uses v<VERSION_NAME> from husi.properties'
        required: false
        default: ''
        type: string
      no-publish:
        description: 'Build artifacts without publishing a GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS (darwin-arm64)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/load-build-versions

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: ./.github/actions/gradle-cache
        with:
          read-only: 'true'
          build-cache-name: release-desktop

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'

      - uses: ./.github/actions/setup-zig
        with:
          cache-name: desktop-darwin-arm64
          cache-hash: ${{ hashFiles('launcher/**', 'libcore/shim/**') }}

      - name: Checkout JNI headers
        uses: actions/checkout@v7
        with:
          repository: Casterlabs/jni-headers
          ref: ${{ env.JNI_HEADERS_COMMIT }}
          path: jni-headers
          sparse-checkout: versions/${{ env.JNI_HEADERS_VERSION }}

      - name: Checkout macOS SDK
        uses: actions/checkout@v7
        with:
          repository: alexey-lysiuk/macos-sdk
          ref: ${{ env.MACOS_SDK_COMMIT }}
          path: macos-sdk
          sparse-checkout: MacOSX${{ env.MACOS_SDK_VERSION }}.sdk

      - name: Install system packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y xorriso
          if ! command -v xorrisofs >/dev/null 2>&1 && command -v xorriso >/dev/null 2>&1; then
            sudo ln -sf "$(which xorriso)" /usr/local/bin/xorrisofs
          fi
          which xorrisofs || which xorriso || true

      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: >-
            assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/ruleset_generate/**', 'libcore/cmd/internal/shared/**', 'libcore/go.mod', 'libcore/go.sum') }}

      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets

      - name: Build desktop libcore
        run: make libcore_desktop DESKTOP_TARGETS="darwin/arm64" JNI_INCLUDE="$JNI_INCLUDE" DARWIN_SDK="$MACOS_SDK_PATH"

      - name: Download Go modules
        run: cd libcore && go mod download

      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_desktop DESKTOP_TARGET="darwin/arm64"

      - name: Build macOS package
        run: |
          ./release/macos/package.sh --check-tools --target darwin/arm64
          make desktop_package_macos DESKTOP_TARGET="darwin/arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-darwin-arm64
          path: composeApp/build/compose/packages
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mapping-darwin-arm64
          path: composeApp/build/compose/mapping/*-mapping.txt
          if-no-files-found: warn
          compression-level: 9

      - name: Resolve release tag
        if: ${{ !inputs.no-publish }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            version="$(awk -F= '$1=="VERSION_NAME"{print $2; exit}' husi.properties)"
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        if: ${{ !inputs.no-publish }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find composeApp/build/compose/packages -type f -name '*.dmg' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DMG files found in composeApp/build/compose/packages" >&2
            exit 1
          fi
          echo "Publishing DMG packages for tag $RELEASE_TAG: ${files[*]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --prerelease
          fi
